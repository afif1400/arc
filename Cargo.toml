[package]
name = "arc-lang"
version = "0.1.0"
edition = "2021"
description = "A minimal, LLM-native architecture diagram language and renderer"
license = "MIT"
repository = "https://github.com/afif1400/arc"
homepage = "https://github.com/afif1400/arc"
readme = "README.md"
keywords = ["diagram", "architecture", "svg", "cli", "mcp"]
categories = ["command-line-utilities", "visualization", "development-tools"]

[[bin]]
name = "arc"
path = "src/main.rs"

[lib]
name = "arc_lang"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
